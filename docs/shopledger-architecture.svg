<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture diagram of the ShopLedger browser UI, Express routes, library modules, configuration and JSON data store, with the order placement flow highlighted.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="flowArrow" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,3.5 L0,7 Z" fill="#b45309"/>
    </marker>
    <style>
      .title{font:700 28px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}
      .subtitle{font:400 14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}
      .section{font:700 16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}
      .boxTitle{font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#0f172a}
      .file{font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}
      .small{font:400 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}
      .flow{font:600 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#92400e}
      .group{stroke:#cbd5e1;stroke-width:1.5;rx:14}
      .node{stroke:#94a3b8;stroke-width:1.2;rx:9;filter:url(#shadow)}
      .route{fill:#eff6ff}
      .lib{fill:#f0fdf4}
      .data{fill:#fff7ed}
      .ui{fill:#faf5ff}
      .config{fill:#fefce8}
      .line{stroke:#64748b;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
      .flowLine{stroke:#b45309;stroke-width:3;fill:none;marker-end:url(#flowArrow)}
      .dashed{stroke-dasharray:7 6}
    </style>
  </defs>

  <rect width="1800" height="1180" fill="url(#bg)"/>
  <text x="70" y="58" class="title">ShopLedger architecture</text>
  <text x="70" y="84" class="subtitle">Browser UI → routes/ → lib/ → data/db.json · order placement flow highlighted in amber</text>

  <!-- UI -->
  <rect x="55" y="120" width="1690" height="170" class="group" fill="#f5f3ff"/>
  <text x="78" y="150" class="section">Browser UI</text>
  <rect x="78" y="170" width="430" height="92" class="node ui"/>
  <text x="98" y="198" class="boxTitle">public/index.html</text>
  <text x="98" y="220" class="file">Billing · Order History · Khata · Audit</text>
  <text x="98" y="242" class="file">loads public/js/app.js</text>
  <rect x="548" y="170" width="470" height="92" class="node ui"/>
  <text x="568" y="198" class="boxTitle">public/js/app.js</text>
  <text x="568" y="220" class="file">cart · preview · submit · refresh</text>
  <text x="568" y="242" class="file">XMLHttpRequest GET/POST calls</text>
  <rect x="1058" y="170" width="430" height="92" class="node ui"/>
  <text x="1078" y="198" class="boxTitle">public/css/style.css</text>
  <text x="1078" y="220" class="file">visual styling for all views</text>
  <rect x="1528" y="170" width="190" height="92" class="node config"/>
  <text x="1548" y="198" class="boxTitle">server.js</text>
  <text x="1548" y="220" class="file">static UI</text>
  <text x="1548" y="242" class="file">Express app</text>

  <!-- Routes -->
  <rect x="55" y="330" width="830" height="340" class="group" fill="#eff6ff"/>
  <text x="78" y="360" class="section">routes/</text>
  <rect x="78" y="382" width="382" height="112" class="node route"/>
  <text x="98" y="410" class="boxTitle">routes/products.js</text>
  <text x="98" y="434" class="file">GET /api/products</text>
  <text x="98" y="456" class="file">GET /api/coupons</text>
  <rect x="484" y="382" width="382" height="112" class="node route"/>
  <text x="504" y="410" class="boxTitle">routes/orders.js</text>
  <text x="504" y="434" class="file">GET /api/orders · GET /api/orders/:id</text>
  <text x="504" y="456" class="file">POST /api/orders · POST .../cancel</text>
  <rect x="78" y="520" width="382" height="112" class="node route"/>
  <text x="98" y="548" class="boxTitle">routes/customers.js</text>
  <text x="98" y="572" class="file">GET /api/customers</text>
  <text x="98" y="594" class="file">POST .../:id/settle</text>
  <rect x="484" y="520" width="382" height="112" class="node route"/>
  <text x="504" y="548" class="boxTitle">routes/reports.js</text>
  <text x="504" y="572" class="file">dashboard · GST reconciliation</text>
  <text x="504" y="594" class="file">pricing preview · admin export</text>

  <!-- Lib -->
  <rect x="920" y="330" width="825" height="520" class="group" fill="#f0fdf4"/>
  <text x="943" y="360" class="section">lib/</text>
  <rect x="943" y="382" width="240" height="96" class="node lib"/>
  <text x="961" y="410" class="boxTitle">lib/orders.js</text>
  <text x="961" y="434" class="file">add · get · list · cancel</text>
  <rect x="1203" y="382" width="240" height="96" class="node lib"/>
  <text x="1221" y="410" class="boxTitle">lib/inventory.js</text>
  <text x="1221" y="434" class="file">find · check · reserve</text>
  <rect x="1463" y="382" width="240" height="96" class="node lib"/>
  <text x="1481" y="410" class="boxTitle">lib/pricing.js</text>
  <text x="1481" y="434" class="file">subtotal · computeTotals</text>
  <rect x="943" y="500" width="240" height="96" class="node lib"/>
  <text x="961" y="528" class="boxTitle">lib/coupons.js</text>
  <text x="961" y="552" class="file">normalize · validate</text>
  <rect x="1203" y="500" width="240" height="96" class="node lib"/>
  <text x="1221" y="528" class="boxTitle">lib/tax.js</text>
  <text x="1221" y="552" class="file">HSN rate · CGST/SGST</text>
  <rect x="1463" y="500" width="240" height="96" class="node lib"/>
  <text x="1481" y="528" class="boxTitle">lib/ledger.js</text>
  <text x="1481" y="552" class="file">Khata billing · settlement</text>
  <rect x="943" y="618" width="240" height="96" class="node lib"/>
  <text x="961" y="646" class="boxTitle">lib/store.js</text>
  <text x="961" y="670" class="file">read · write · audit</text>
  <rect x="1203" y="618" width="240" height="96" class="node lib"/>
  <text x="1221" y="646" class="boxTitle">lib/reports.js</text>
  <text x="1221" y="670" class="file">dashboard · reconciliation</text>
  <rect x="1463" y="618" width="240" height="96" class="node lib"/>
  <text x="1481" y="646" class="boxTitle">lib/invoice.js</text>
  <text x="1481" y="670" class="file">compute · render HTML</text>
  <rect x="943" y="736" width="240" height="88" class="node lib"/>
  <text x="961" y="764" class="boxTitle">lib/dates.js</text>
  <text x="961" y="788" class="file">today · date filters</text>

  <!-- Config and data -->
  <rect x="55" y="725" width="830" height="125" class="group" fill="#fffbeb"/>
  <text x="78" y="755" class="section">Configuration and persistence</text>
  <rect x="78" y="777" width="382" height="52" class="node config"/>
  <text x="98" y="809" class="boxTitle">config.js</text>
  <text x="270" y="809" class="file">shop · tax · coupons · inventory</text>
  <rect x="484" y="777" width="382" height="52" class="node data"/>
  <text x="504" y="809" class="boxTitle">data/db.json</text>
  <text x="684" y="809" class="file">products · orders · customers · audit</text>

  <!-- General wiring -->
  <path d="M508 216 L548 216" class="line"/>
  <path d="M1018 216 L1528 216" class="line dashed"/>
  <path d="M1528 244 C1380 290 700 300 460 382" class="line"/>
  <path d="M1528 244 C1460 290 1000 320 866 382" class="line"/>
  <path d="M1528 244 C1510 300 1470 330 1430 382" class="line"/>
  <path d="M1528 244 C1500 340 1410 430 1430 500" class="line dashed"/>
  <path d="M1528 244 C1490 420 1370 550 1430 618" class="line dashed"/>
  <path d="M278 494 C430 560 790 590 943 668" class="line"/>
  <path d="M675 494 C760 520 860 520 943 430" class="line"/>
  <path d="M675 632 C760 650 850 680 943 668" class="line"/>
  <path d="M1183 430 L1203 430" class="line"/>
  <path d="M1443 430 L1463 430" class="line"/>
  <path d="M1183 548 L1203 548" class="line"/>
  <path d="M1443 548 L1463 548" class="line"/>
  <path d="M1183 666 L1203 666" class="line"/>
  <path d="M1443 666 L1463 666" class="line"/>
  <path d="M1183 780 C1260 790 1330 760 1463 700" class="line dashed"/>
  <path d="M1063 714 L1063 777" class="line dashed"/>
  <path d="M675 829 C800 900 960 875 1063 714" class="line dashed"/>

  <!-- Order flow -->
  <rect x="55" y="900" width="1690" height="235" class="group" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="78" y="932" class="section">Place an order</text>
  <rect x="78" y="962" width="192" height="110" class="node data" stroke="#f59e0b"/>
  <text x="96" y="992" class="boxTitle">public/js/app.js</text>
  <text x="96" y="1016" class="file">cart + coupon</text>
  <text x="96" y="1038" class="file">POST /api/orders</text>
  <rect x="316" y="962" width="216" height="110" class="node data" stroke="#f59e0b"/>
  <text x="334" y="992" class="boxTitle">routes/orders.js</text>
  <text x="334" y="1016" class="file">resolve products</text>
  <text x="334" y="1038" class="file">check stock + coupon</text>
  <rect x="578" y="962" width="216" height="110" class="node data" stroke="#f59e0b"/>
  <text x="596" y="992" class="boxTitle">lib/pricing.js</text>
  <text x="596" y="1016" class="file">subtotal · discount</text>
  <text x="596" y="1038" class="file">GST · total</text>
  <rect x="840" y="962" width="216" height="110" class="node data" stroke="#f59e0b"/>
  <text x="858" y="992" class="boxTitle">lib/ledger.js</text>
  <text x="858" y="1016" class="file">Khata check</text>
  <text x="858" y="1038" class="file">if paymentMode=khata</text>
  <rect x="1102" y="962" width="216" height="110" class="node data" stroke="#f59e0b"/>
  <text x="1120" y="992" class="boxTitle">lib/inventory.js</text>
  <text x="1120" y="1016" class="file">reserve()</text>
  <text x="1120" y="1038" class="file">deduct stock</text>
  <rect x="1364" y="962" width="180" height="110" class="node data" stroke="#f59e0b"/>
  <text x="1382" y="992" class="boxTitle">lib/orders.js</text>
  <text x="1382" y="1016" class="file">add()</text>
  <text x="1382" y="1038" class="file">assign ID/date</text>
  <rect x="1590" y="962" width="128" height="110" class="node data" stroke="#f59e0b"/>
  <text x="1608" y="992" class="boxTitle">lib/store.js</text>
  <text x="1608" y="1016" class="file">audit</text>
  <text x="1608" y="1038" class="file">write()</text>
  <path d="M270 1017 L316 1017" class="flowLine"/>
  <path d="M532 1017 L578 1017" class="flowLine"/>
  <path d="M794 1017 L840 1017" class="flowLine"/>
  <path d="M1056 1017 L1102 1017" class="flowLine"/>
  <path d="M1318 1017 L1364 1017" class="flowLine"/>
  <path d="M1544 1017 L1590 1017" class="flowLine"/>
  <text x="91" y="1102" class="flow">201 Created → refresh products, dashboard, customers → GET /orders/:id/invoice → lib/invoice.js</text>
</svg>
